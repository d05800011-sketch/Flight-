name: Update flights

on:
  schedule:
    - cron: '0 * * * *'   # раз в час; подберите под лимит вашего тарифа AirLabs
  workflow_dispatch:       # ручной запуск кнопкой Run workflow

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch schedules from AirLabs
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
          AIRPORTS: ${{ vars.AIRPORTS }}
          BOARDS: ${{ vars.BOARDS }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
        run: node scripts/update-flights.mjs

      - name: Commit data
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add data/flights.json
          git diff --staged --quiet || (git commit -m "Update flights data" && git push)
